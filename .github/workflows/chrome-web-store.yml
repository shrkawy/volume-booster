name: Chrome Web Store release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Submit this version to Chrome Web Store for review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/package.py "$RELEASE_TAG"
      - name: Validate and package
        if: github.event_name != 'release'
        run: python scripts/package.py
      - name: Test audio processing
        run: node test/dsp-test.js
      - name: Test store publishing without network access
        run: node --test scripts/publish.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-package
          path: dist/*.zip
          if-no-files-found: error
      - name: Submit release for Chrome Web Store review
        if: >-
          (github.event_name == 'release' && !github.event.release.prerelease) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        run: node scripts/publish.mjs dist/*.zip

