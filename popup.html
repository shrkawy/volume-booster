<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Clean Volume Booster</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <img src="icons/icon32.png" alt="" width="18" height="18" />
          <span>Clean Volume Booster</span>
        </div>
        <span class="chip" title="A limiter keeps output below -1 dB, so audio is never clipped.">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 1.5 2.5 3.5v4c0 3.4 2.3 6 5.5 7 3.2-1 5.5-3.6 5.5-7v-4L8 1.5Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m5.6 8 1.7 1.7L10.6 6.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          No clipping
        </span>
      </header>

      <section class="card tab-card">
        <div class="fav-wrap">
          <img id="fav" alt="" width="16" height="16" hidden />
          <svg id="favFallback" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.75 8h12.5M8 1.75c1.8 1.7 2.7 3.8 2.7 6.25S9.8 12.55 8 14.25C6.2 12.55 5.3 10.45 5.3 8S6.2 3.45 8 1.75Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </div>
        <div class="tab-meta">
          <div id="tabTitle" class="tab-title">This tab</div>
          <div id="tabSub" class="tab-sub">Off</div>
        </div>
        <button id="power" class="switch" role="switch" aria-checked="false" aria-label="Boost this tab"></button>
      </section>

      <div id="dial" class="dial" role="slider" tabindex="0" aria-label="Boost level"
           aria-valuemin="100" aria-valuemax="250" aria-valuenow="150" aria-valuetext="150 percent">
        <svg viewBox="0 0 220 200" width="220" height="200" aria-hidden="true">
          <defs>
            <linearGradient id="arcGrad" gradientUnits="userSpaceOnUse" x1="22" y1="0" x2="198" y2="0">
              <stop offset="0" stop-color="#38bdf8" />
              <stop offset="0.5" stop-color="#6366f1" />
              <stop offset="0.8" stop-color="#a855f7" />
              <stop offset="1" stop-color="#f59e0b" />
            </linearGradient>
          </defs>
          <g id="ticks"></g>
          <circle class="face" cx="110" cy="110" r="68" />
          <path class="track" d="M47.775 172.225A88 88 0 1 1 172.225 172.225" />
          <path id="arc" class="arc" pathLength="100" d="M47.775 172.225A88 88 0 1 1 172.225 172.225" />
          <circle id="knob" class="knob" r="7" cx="47.775" cy="172.225" />
          <text class="end-label" x="47" y="196" text-anchor="middle">100</text>
          <text class="end-label" x="173" y="196" text-anchor="middle">250</text>
        </svg>
        <div class="readout">
          <div class="label">Boost</div>
          <div class="num"><span id="num">150</span><span class="pct">%</span></div>
          <div id="db" class="db">+3.5 dB</div>
        </div>
      </div>

      <div class="presets" role="group" aria-label="Presets">
        <button data-v="100" aria-pressed="false">100</button>
        <button data-v="125" aria-pressed="false">125</button>
        <button data-v="150" aria-pressed="false">150</button>
        <button data-v="200" aria-pressed="false">200</button>
        <button data-v="250" aria-pressed="false">250</button>
      </div>

      <section class="card status" aria-live="polite">
        <span id="statusDot" class="dot"></span>
        <span id="statusText" class="status-text">Off</span>
        <span class="leds" id="leds" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
      </section>

      <section class="card row">
        <div class="row-text">
          <div id="protectLabel" class="row-title">Speaker protection</div>
          <div class="row-sub">Cuts rumble below 30 Hz that small speakers strain on</div>
        </div>
        <button id="protect" class="switch" role="switch" aria-checked="true" aria-labelledby="protectLabel"></button>
      </section>

      <p id="error" class="error" role="alert" hidden></p>

      <footer class="hint">
        <kbd>↑</kbd><kbd>↓</kbd> adjust <span class="sep">·</span> <kbd>Space</kbd> on/off <span class="sep">·</span> scroll the dial
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
